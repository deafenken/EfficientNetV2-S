# eB3 — Direction B trial 3: TF-EfficientNetV2-B2 (in1k).
#
# Same V2 architectural family as our V2-S baseline but smaller (~9.1M params
# vs V2-S 20.2M; num_features=1408). num_features=1408. Acts as an
# "is V2-S overparameterized for our 28k-row 234-class setup?" test —
# if the smaller model matches or beats V2-S, capacity wasn't the issue.

model:
  name: tf_efficientnetv2_b2.in1k
  pretrained: true
  head_dropout: 0.5
  backbone_in_chans: 1
  pretrained_backbone_path: null

optim:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  lr_min: 1.0e-6

train:
  batch_size_per_gpu: 64
  val_batch_size: 64
  num_workers: 8
  prefetch_factor: 2
  epochs: 50
  warmup_epochs: 2
  amp_dtype: bf16
  grad_clip: 1.0
  ema_decay: 0.999

loss:
  alpha: 0.25
  gamma: 2.0
  bce_weight: 1.0
  focal_weight: 1.0
  label_smoothing: 0.05
  ls_mode: positive
  pos_weight: 5.0

augment:
  background_noise:
    enabled: false
