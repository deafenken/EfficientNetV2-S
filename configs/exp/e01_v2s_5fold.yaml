# Experiment e01 — EfficientNetV2-S baseline (5-fold).
#
# Mirrors BirdCLEF 2025 2nd Place's V2-S setup, with a few L40 / bf16
# adaptations:
#   * bf16 AMP (free on Ada; 2nd place was FP32)
#   * EMA decay 0.999 (off in 2nd place)
#   * grad_clip 1.0 (off in 2nd place; defensive against rare loss spikes)
#   * 2-epoch LinearLR warmup → CosineAnnealingLR (2nd place was CosineWarmRestarts no warmup)
#
# Expected (4×L40, 50 ep × 5 fold):
#   wall clock ≈ 8–12 h total
#   single-fold OOF macro-AUC ≈ 0.91–0.93
#   5-fold mean OOF ≈ 0.92 ± 0.005
#
# Run:
#   bash scripts/10_train.sh configs/exp/e01_v2s_5fold.yaml 0
#   ... (folds 1..4 in turn or on separate machines)

model:
  name: tf_efficientnetv2_s.in21k_ft_in1k
  pretrained: true
  head_dropout: 0.5

optim:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  lr_min: 1.0e-6

train:
  batch_size_per_gpu: 64
  val_batch_size: 64
  num_workers: 8
  prefetch_factor: 2
  epochs: 50
  warmup_epochs: 2
  amp_dtype: bf16          # only 'bf16' (default on L40) or 'fp32'; fp16 was removed (no GradScaler)
  grad_clip: 1.0
  ema_decay: 0.999

loss:
  # 2025 2nd Place exact recipe: FocalBCELoss with α=0.25, γ=2 (torchvision
  # default), bce/focal weighted 1:1, label_smoothing=0.05 in 'positive' mode.
  # The earlier "BCE-only + pos_weight=10" was a hack to break a trivial-zero
  # attractor caused by NOT having a class-balanced sampler (Tier 2B). Once
  # the sqrt-balanced sampler is in place the per-batch positive density rises
  # enough that focal+α=0.25 works as intended (negatives 0.75 weight is fine
  # because focal's (1-p_t)^γ already kills easy negatives).
  #
  # Reference: github.com/VSydorskyy/BirdCLEF_2025_2nd_place
  #   train_configs/selected_ebs.py — use_bce_focal_loss=True, label_smoothing=0.05,
  #   no pos_weight, no class weights in loss (sampler does class balance).
  alpha: 0.25
  gamma: 2.0
  bce_weight: 1.0
  focal_weight: 1.0
  label_smoothing: 0.05
  ls_mode: positive         # 'standard' | 'positive' | 'off'
  pos_weight: null          # class balance handled by sampler (Tier 2B)

# Augmentation — overrides the defaults in configs/data.yaml only where needed.
augment:
  background_noise:
    enabled: false
    # Once you've downloaded ESC-50 + soundscape-nocall, point dirs here:
    # dirs:
    #   - data/aux/esc50/audio
    #   - data/aux/soundscape_nocall
