# Experiment e01 — EfficientNetV2-S baseline (5-fold).
#
# Mirrors BirdCLEF 2025 2nd Place's V2-S setup, with a few L40 / bf16
# adaptations:
#   * bf16 AMP (free on Ada; 2nd place was FP32)
#   * EMA decay 0.999 (off in 2nd place)
#   * grad_clip 1.0 (off in 2nd place; defensive against rare loss spikes)
#   * 2-epoch LinearLR warmup → CosineAnnealingLR (2nd place was CosineWarmRestarts no warmup)
#
# Expected (4×L40, 50 ep × 5 fold):
#   wall clock ≈ 8–12 h total
#   single-fold OOF macro-AUC ≈ 0.91–0.93
#   5-fold mean OOF ≈ 0.92 ± 0.005
#
# Run:
#   bash scripts/10_train.sh configs/exp/e01_v2s_5fold.yaml 0
#   ... (folds 1..4 in turn or on separate machines)

model:
  name: tf_efficientnetv2_s.in21k_ft_in1k
  pretrained: true
  head_dropout: 0.5

optim:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  lr_min: 1.0e-6

train:
  batch_size_per_gpu: 64
  val_batch_size: 64
  num_workers: 8
  prefetch_factor: 2
  epochs: 50
  warmup_epochs: 2
  amp_dtype: bf16          # only 'bf16' (default on L40) or 'fp32'; fp16 was removed (no GradScaler)
  grad_clip: 1.0
  ema_decay: 0.999

loss:
  # NOTE: switched from BCE+Focal (1:1, α=0.25, γ=2) to BCE-only after the
  # original recipe gave val_auc≈0.52 plateau across 3 epochs even after
  # mel_stats / val crop / EMA-warmup / DDP fixes were in place.
  #
  # Why focal hurts here: torchvision's α=0.25 weights *positives* by 0.25,
  # negatives by 0.75 — designed for object detection where most anchors
  # are negative, but in 234-way multi-label SED we only have ~1-3 positives
  # per row (already 100:1 imbalance), so α=0.25 *further* suppresses the
  # already-rare positive gradient. BirdCLEF 2024 1st place rejected focal
  # for CE/BCE; BirdCLEF 2025 top-2% reported BCE > Focal too.
  #
  # If you want to revisit focal, flip α to 0.75 (or higher) so positives
  # get the larger weight, and consider focal_weight ≤ 0.5 so BCE leads.
  alpha: 0.25
  gamma: 2.0
  bce_weight: 1.0
  focal_weight: 0.0
  label_smoothing: 0.005
  ls_mode: standard         # 'standard' | 'positive' | 'off'
  # n_neg/n_pos ≈ 192:1 in 234-way val. With BCE(reduction='mean') the
  # negative term collectively swamps the per-row positive gradient — model
  # collapses to "predict ≈0 everywhere" (val_auc ≈ 0.5, p99 < 0.07, the
  # diag's gap=0.004 confirmed this). pos_weight upweights the positive
  # term inside binary_cross_entropy_with_logits to break the trivial-zero
  # attractor. 10 is a moderate starting point (sqrt(192) ≈ 14; full
  # balance would be 192 but tends to overshoot to "predict everything").
  pos_weight: 10.0

# Augmentation — overrides the defaults in configs/data.yaml only where needed.
augment:
  background_noise:
    enabled: false
    # Once you've downloaded ESC-50 + soundscape-nocall, point dirs here:
    # dirs:
    #   - data/aux/esc50/audio
    #   - data/aux/soundscape_nocall
