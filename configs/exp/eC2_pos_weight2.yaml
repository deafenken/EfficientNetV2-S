# eC2 — Direction C trial 2: pos_weight=2.0 (single-knob ablation vs e01).
#
# e01 has pos_weight=5.0 (was 10 → 5 after warm backbone landed). Hypothesis:
# now that the warm BC2024 backbone gives strong features AND the sqrt-balanced
# sampler raises per-batch positive density, pos_weight=5 may over-amplify
# positive gradients and silence the negatives prematurely. pos_weight=2 is
# the gentler kick. If SWA improves, we've been pushing too hard on
# the positive side; if it regresses to 0.85 trivial-zero, we still need >2.

model:
  name: tf_efficientnetv2_s.in21k_ft_in1k
  pretrained: true
  head_dropout: 0.5
  backbone_in_chans: 1
  pretrained_backbone_path: data/aux/pretrained/v2s_bc2024_pretrain.pth

optim:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  lr_min: 1.0e-6

train:
  batch_size_per_gpu: 64
  val_batch_size: 64
  num_workers: 8
  prefetch_factor: 2
  epochs: 50
  warmup_epochs: 2
  amp_dtype: bf16
  grad_clip: 1.0
  ema_decay: 0.999

loss:
  alpha: 0.25
  gamma: 2.0
  bce_weight: 1.0
  focal_weight: 1.0
  label_smoothing: 0.05
  ls_mode: positive
  pos_weight: 2.0    # ABLATION (default 5.0)

augment:
  background_noise:
    enabled: false
