# ============================================================================
# submissions/manifest.yaml — SINGLE SOURCE OF TRUTH for every Kaggle submission
# ============================================================================
#
# This file maps, for each variant we have ever pushed:
#
#   exp_config  →  checkpoint  →  kaggle dataset (+version)  →  kernel (+version)
#                →  OOF AUC  →  public/private LB
#
# Why this exists: before this manifest the mapping lived only in git commit
# messages, hardcoded paths inside scripts/22_kaggle_submit.py, dataset
# version_notes timestamps, and docs/optimization_roadmap.md (which stops at
# A29). Answering "why did b03 score X / which ckpt is on Kaggle for b08?" meant
# grep-ing four places. Now it is one auditable file.
#
# The b-line block below is CONSUMED by the submit tool:
#   uv run python scripts/kaggle/submit.py b03_eB1b_nfnet_bgnoise
# `scripts/kaggle/manifest.py` loads `b_variants` into Variant objects (the
# payload dir is derived as /tmp/<dataset slug>, the kernel dir as
# kaggle/variants/<id>). `make audit-submissions` validates this file against
# kaggle/variants/<id>/kernel-metadata.json, the dataset-metadata.json on disk,
# and the checkpoint paths.
#
# Naming of every id / prefix / proper noun is explained in docs/NAMING.md.
# LB fill-in flow:  uv run python scripts/kaggle/record_score.py <id> --public 0.xxx
# ----------------------------------------------------------------------------

owners:
  # b-line (our own trained models) — datasets AND kernels live here:
  b_line: winbeaux
  # a-line (public-notebook clones/blends) — kernels were pushed here:
  a_line: longkunshicandyman
  team: "Longkun Shi (Candyman)"

# Medal cuts pulled via Kaggle API (~2026-05; see docs/optimization_roadmap.md):
#   bronze ~0.943  silver ~0.944  gold ~0.949  top1 ~0.956  (2913 teams)
# Our best CONFIRMED LB: 0.929 (a29_nina_ensemble_solutions).

