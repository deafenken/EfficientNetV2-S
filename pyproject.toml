[project]
name = "birdclef2026"
version = "0.1.0"
description = "BirdCLEF+ 2026 PyTorch baseline (training, inference, public-baseline reproductions)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.23,<2.3",
    "pandas>=1.5,<2.3",
    "scikit-learn>=1.2",
    "lightgbm>=4.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    # Pin torch family to 2.8.x — last line on PyPI shipping the CUDA 12.8 stack.
    # Driver 580 + L40 (compute 8.9) is fully compatible with CUDA 12.x.
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "torchaudio>=2.8,<2.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyarrow>=15.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdclef2026"]

[tool.uv]
package = true
