# pre-commit hooks for birdclef-2026 — secret scanning + metadata validation.
#
# Install once (on whichever box you commit from):
#   uv tool install pre-commit     # or: pipx install pre-commit
#   pre-commit install
# Run on demand against everything:
#   pre-commit run --all-files
#
# Deliberately minimal: gitleaks (block committed Kaggle keys) + JSON/YAML
# validation (catch kernel-metadata.json / manifest.yaml typos) + a large-file
# guard. No auto-formatters, so commits never get silently rewritten mid-flow.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-json
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=5120]
